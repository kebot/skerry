[package]
name = "rb-cdp"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.34"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
