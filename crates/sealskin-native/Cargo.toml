[package]
name = "sealskin-native-app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.17.3"
dotenvy = "0.15"
futures-util = { version = "0.3", features = ["sink"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButton", "NSControl", "NSGraphics", "NSView", "NSWindow"] }
opus-decoder = "0.1.1"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
