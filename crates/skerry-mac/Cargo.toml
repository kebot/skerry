[package]
name = "skerry-mac"
edition.workspace = true
version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
core-foundation = "0.10"
cpal = "0.17.3"
dotenvy = "0.15"
futures-util = { version = "0.3", features = ["sink"] }
gpui-kit = "0.10.0"
# setrlimit for the SVG icon worker (`ARCH-035`).
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
objc2 = "0.6"
# Microphone and camera uplink (`ARCH-038`): the Opus encoder is AudioToolbox's own
# `AudioConverter`, the permission prompt is `AVCaptureDevice`'s, and the camera is an
# `AVCaptureSession` feeding VideoToolbox. The audio crates are already locked through cpal.
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "AudioConverter", "objc2-core-audio-types"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-video", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "block2", "objc2"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphics", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-uniform-type-identifiers"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFArray", "CFDictionary", "CFNumber", "CFString", "objc2"] }
# Input devices from plain properties, so listing never asks TCC (`ARCH-038`).
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGDirectDisplay", "CGError", "CGRemoteOperation", "libc"] }
objc2-core-haptics = { version = "0.3.2", default-features = false, features = ["std", "block2", "CHHapticEngine", "CHHapticEvent", "CHHapticParameter", "CHHapticPattern", "CHHapticPatternPlayer"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "objc2", "objc2-io-surface"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSLocale", "NSNotification", "NSOperation", "NSProcessInfo", "NSSet", "NSString", "block2", "NSTimeZone", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-game-controller = { version = "0.3.2", default-features = false, features = ["std", "block2", "GCController", "GCControllerAxisInput", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerElement", "GCDevice", "GCDeviceHaptics", "GCExtendedGamepad", "GCPhysicalInputProfile"] }
# Enable the CF type implementation required by Core Video's IOSurface getter.
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["UTType"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "PDFDocument", "objc2-app-kit"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["objc2-core-foundation"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["VTCompressionProperties", "VTCompressionSession", "VTDecompressionProperties", "VTDecompressionSession", "VTErrors", "VTSession", "objc2", "objc2-core-media", "objc2-core-video"] }
opus-decoder = "0.1.1"
percent-encoding = "2.3"
raw-window-handle = "0.6"
# SVG app icons (`ARCH-035`): the copy gpui-pre links; `text` only for the empty font database.
resvg = { version = "0.46", default-features = false, features = ["text"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
# Direct Selkies TLS (ARCH-036). ring only: a second provider (aws-lc-rs) would make the
# default connectors without an explicit provider panic at runtime.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
skerry-ui = { path = "../skerry-ui" }
serde_json = "1"
# The proot-apps catalog (`ARCH-035`), parsed under a budget; the copy gpui-pre links.
serde-saphyr = "1.3"
smallvec = "1"
tempfile = "3"
toml_edit = "0.25.20"
uuid = { version = "1", default-features = false, features = ["v4"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"
# JPEG stripes decode straight to BGRA (`ARCH-034`); already locked through `image`.
zune-core = "0.5"
zune-jpeg = "0.5"


[target.'cfg(target_os = "macos")'.dev-dependencies]
# Checks `open_target` against SealSkin's own URL pattern.
regex = "1"
# A self-signed server for the pinning tests, ring only (ARCH-036).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
