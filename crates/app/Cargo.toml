[package]
name = "rb-app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# runtime_shaders: compile Metal shaders at runtime, so the Xcode Metal Toolchain
# component is not needed at build time.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
rb-cdp = { path = "../cdp" }
rb-store = { path = "../store" }
rb-manager = { path = "../manager" }
# Mirror: JPEG Frames are decoded here (not by gpui) so the texture can be dropped.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde_json = "1.0.154"
smallvec = "1"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
base64 = "0.22.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
